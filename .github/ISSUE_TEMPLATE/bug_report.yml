name: 缺陷反馈
description: 报告一个可复现的问题，帮助定位原因
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。把「环境 + 复现步骤 + 日志」写全，通常能省掉好几轮来回。

        提交前建议先看一眼 [常见问题](https://github.com/7rikka/JarBox#常见问题)，端口识别、恢复行为、360 拦截这几类情况那里有说明。

  - type: input
    id: version
    attributes:
      label: JarBox 版本
      description: 填下载的文件名或设置页显示的版本号
      placeholder: 1.0.0（JarBox-1.0.0-portable.exe）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本
      description: 运行 `winver` 可以看到，请带上内部版本号
      placeholder: Windows 11 专业版 23H2 (22631.4169)
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK 版本
      description: 出问题的服务用的是哪个 JDK（发行版 + 版本号）
      placeholder: Temurin 17.0.11 / Oracle JDK 8u401

  - type: dropdown
    id: area
    attributes:
      label: 出问题的部分
      options:
        - 服务启停
        - 端口识别
        - 日志查看
        - 设置 / JDK 配置
        - 导入 JAR
        - 开机自启
        - 托盘 / 窗口 / 单实例
        - 启动恢复
        - 其他
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 现象
      description: 你期待什么，实际发生了什么
      placeholder: |
        期待：点启动后 3 秒内状态变绿，端口显示 8080
        实际：状态一直是「启动中」，10 秒后变红
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 设置里工作目录选 D:\jar-test，JDK 选 Temurin 17
        2. 导入 demo.jar
        3. 点「启动」
        4. 观察服务行状态
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: |
        服务日志可以在日志窗口里选中复制（勾选文本时会暂停刷新）。
        界面问题请直接拖截图进来。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 比如是否装了 360 / 火绒等安全软件、是不是从旧版本升级、有没有改过工作目录

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，没有重复
          required: true
        - label: 使用的是最新 Release，不是自己改过的构建
          required: false
